name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testlab
          POSTGRES_PASSWORD: testlab
          POSTGRES_DB: testlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testlab" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://testlab:testlab@localhost:5432/testlab
      RAGAS_DO_NOT_TRACK: "true"
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (adapter contracts with mocked judge + API)
        run: python -m pytest -q
      - name: Migrations apply cleanly
        env:
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdefghij
          ENCRYPTION_KEY: Tc6ChKpBPEGbdT6zxqhrJ1EoLJbm6CkqbvZyQ5JcUfA=
        run: alembic upgrade head
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
