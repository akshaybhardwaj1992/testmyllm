[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testmyllm-cli"
version = "0.1.0"
description = "TestMyLLM CLI: run evaluations and quality gates from CI"
requires-python = ">=3.10"
dependencies = []  # standard library only

[project.scripts]
testmyllm = "testmyllm_cli.main:main_entry"

[tool.setuptools]
packages = ["testmyllm_cli"]
