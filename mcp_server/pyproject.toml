[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testmyllm-mcp"
version = "0.1.0"
description = "MCP server for TestMyLLM: score answers, run evaluations, read runs and compare against baselines."
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]

[project.scripts]
testmyllm-mcp = "testmyllm_mcp.server:main"

[tool.setuptools]
packages = ["testmyllm_mcp"]
